[package]
name = "rociadb-sdk"
version = "2.0.0"
edition = "2024"
description = "Rust client SDK for RociaDB document, graph, file, and tenant gRPC services"
license = "Apache-2.0"
repository = "https://github.com/RociaDB/rociadb-core-sdk-rust"
homepage = "https://github.com/RociaDB/rociadb-core-sdk-rust"
documentation = "https://docs.rs/rociadb-sdk"
readme = "README.md"
keywords = ["rociadb", "database", "grpc", "sdk", "async"]
categories = ["api-bindings", "database", "network-programming", "asynchronous"]
# `edition = "2024"` needs 1.85, but the real floor comes from the dependency
# graph rather than the edition: tonic and tonic-prost 0.14.6 — which the
# "0.14.2" requirement below already resolves to — declare `rust-version =
# "1.88"`, as does the `tonic-prost-build` used at build time, and the icu_*
# crates reached through reqwest -> url -> idna declare 1.86. `protox` itself
# asks for only 1.74, so it does not move this floor. Re-check this field after
# any `cargo update` that moves tonic, tonic-prost, tonic-prost-build, or
# reqwest.
rust-version = "1.88"
# Repository-only files that a consumer of the published crate has no use for.
# Everything the build needs — `build.rs` and `proto/` — must stay in the
# package; the Google well-known types are not vendored, `protox` supplies them
# (see `build.rs`). `CHANGELOG.md` deliberately stays in the package: it is the
# one repository document a consumer reads when upgrading.
exclude = [".github", "AGENTS.md", "deny.toml", "mise.toml"]

[dependencies]
futures = "0.3.31"
http = "1"
# `rustls-tls-native-roots` (not the default `rustls-tls`, which bundles the
# webpki/Mozilla root set) so reqwest trusts the same certificates as tonic's
# `tls-native-roots` below. If these two ever disagree, a self-hosted
# deployment whose gRPC and OAuth2 token endpoints both present a certificate
# from an internally-installed CA gets a channel that connects fine and a
# token fetch that fails TLS verification against that same CA — `build()`
# then surfaces a confusing auth error even though the CA was provisioned
# correctly at the OS level. Keep both crates reading from the OS trust store.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
# Nothing in `src/` names `prost` directly; the generated code does, for
# `::prost::Message` and `::prost::alloc::*`, which is why it is a regular
# dependency and not a build dependency. There is deliberately no
# `prost-types`: `google.protobuf.Empty` is the only well-known type the
# `.proto` imports and prost maps it to `()`, so no generated item names a
# `prost_types` type.
prost = "0.14.1"
# `SecretString` for the OAuth2 client secret and the bearer token: it redacts
# itself in `Debug` output and zeroizes its heap buffer on drop, which is what
# lets `RociaDbBuilder`, `TokenManagerInner` and `TokenResponse` derive `Debug`
# instead of carrying hand-written redacting impls. The `serde` feature is
# needed because `TokenResponse::access_token` is deserialized straight from the
# IdP's JSON into a `SecretString`. MSRV 1.60, well under this crate's 1.88, and
# its only dependency is `zeroize` (already in the graph via rustls).
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# The library needs `rt` (the token-refresh task spawned in `src/auth.rs`),
# `sync` (its `Mutex`/`Notify`/`oneshot`), `time` and `macros` (its
# `tokio::select!`). `rt-multi-thread` is a test-only need — `#[tokio::main]`
# in the doctests defaults to the multi-thread runtime — and lives in
# `[dev-dependencies]` so a consumer does not pay for it.
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
# `default-features = false` drops tonic's default `router` and `server`
# feature stack (axum, matchit, hyper's server support, hyper-util's
# server-auto) — this SDK is a gRPC client only, build.rs disables server
# codegen, and nothing in src/ uses a server API. `tls-native-roots` already
# pulls in `channel`, which is all `tonic::transport::{Channel, Endpoint,
# ClientTlsConfig}` need.
tonic = { version = "0.14.2", default-features = false, features = ["codegen", "tls-native-roots"] }
tonic-prost = "0.14.2"
tracing = "0.1"
uuid = { version = "1.19.0", features = ["v4"] }

[dev-dependencies]
# `#[tokio::main]` in the crate documentation's examples defaults to the
# multi-thread runtime, and `tests/` spawns tasks, so the test and doctest
# builds need `rt-multi-thread` on top of the library's own feature set.
# `test-util` is what `#[tokio::test(start_paused = true)]` needs: the retry and
# token-refresh backoff tests advance a paused clock instead of sleeping for
# real, so a schedule measured in seconds is still tested in microseconds.
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

# `build.rs` reaches for exactly two crates: `protox`, a pure-Rust protobuf
# compiler that replaces the `protoc` binary (and bundles the Google well-known
# types, so none are vendored in `proto/`), and `tonic_prost_build` — including
# the `prost_build::Config` it re-exports, which is why `prost-build` itself
# does not need to be listed here. Both must agree on the `prost-types` major
# version, since the `FileDescriptorSet` protox produces is handed straight to
# `tonic_prost_build`: protox 0.9 and tonic-prost-build 0.14 both use
# `prost-types` 0.14. The prost and tonic runtime crates the generated code
# links against are regular dependencies above, not build dependencies.
[build-dependencies]
protox = "0.9.1"
tonic-prost-build = { version = "0.14.2" }
